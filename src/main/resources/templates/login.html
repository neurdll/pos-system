<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Iniciar sesión')}"></head>
<body>
<main class="container" style="max-width: 380px; margin-top: 64px;">
  <section class="card stack">
    <h1 class="card-title">Point of Sale · Acceso</h1>

    <div th:if="${param.error}" class="badge badge-danger">
      Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="badge badge-success">
      Sesión cerrada.
    </div>

    <form th:action="@{/login}" method="post" class="stack">
      <div>
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required/>
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <p class="muted" style="margin: 4px 0 0;">
      Demo: <code>admin / admin123</code> (PIN <code>1234</code>) · <code>cajero1 / cajero123</code> (PIN <code>0000</code>)
    </p>
  </section>
</main>
</body>
</html>
