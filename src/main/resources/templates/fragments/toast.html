<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="oob(message, kind)" id="toast-region" hx-swap-oob="beforeend:#toast-region">
  <div class="toast"
       th:classappend="${kind == 'error'} ? ' toast-error' : (${kind == 'success'} ? ' toast-success' : '')"
       x-data="{ show: true }"
       x-init="setTimeout(() => show = false, 3500)"
       x-show="show"
       th:text="${message}">
    Mensaje
  </div>
</div>
</body>
</html>
