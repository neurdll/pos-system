<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal" id="modal-root" class="modal-backdrop"
     x-data="{
       totalCents: [[${sale.totalCents}]],
       tenders: [{ method: 'CASH', amount: ([[${sale.totalCents}]] / 100).toFixed(2), reference: '' }],
       paidCents() {
         return this.tenders.reduce((sum, t) => sum + Math.round((parseFloat(t.amount) || 0) * 100), 0);
       },
       remainingCents() {
         return Math.max(0, this.totalCents - this.paidCents());
       },
       changeCents() {
         return Math.max(0, this.paidCents() - this.totalCents);
       },
       addTender() {
         this.tenders.push({ method: 'CARD', amount: (this.remainingCents() / 100).toFixed(2), reference: '' });
       },
       removeTender(i) {
         if (this.tenders.length > 1) this.tenders.splice(i, 1);
       },
       fmt(cents) {
         return '$' + (cents / 100).toFixed(2);
       }
     }"
     @keydown.escape.window="$el.remove()">

  <div class="modal-card stack" style="max-width: 560px;"
       @click.outside="document.getElementById('modal-root').innerHTML = ''">
    <div class="row-between">
      <h2 class="card-title">Cobrar venta · <span th:text="${@money.format(sale.totalCents)}">$0.00</span></h2>
      <button type="button" class="btn btn-sm"
              onclick="document.getElementById('modal-root').innerHTML = ''">Cerrar</button>
    </div>

    <div id="checkout-error"></div>

    <form th:hx-post="@{/pos/checkout}"
          hx-target="#cart-panel"
          hx-swap="outerHTML"
          class="stack">

      <template x-for="(t, i) in tenders" :key="i">
        <div class="form-grid" style="grid-template-columns: 130px 1fr 1fr auto; align-items: end;">
          <div>
            <label>Método</label>
            <select name="method" x-model="t.method">
              <option value="CASH">Efectivo</option>
              <option value="CARD">Tarjeta</option>
              <option value="TRANSFER">Transferencia</option>
            </select>
          </div>
          <div>
            <label>Monto ($)</label>
            <input name="amount" type="number" step="0.01" min="0" x-model="t.amount" required/>
          </div>
          <div>
            <label>Referencia</label>
            <input name="reference" type="text" x-model="t.reference" placeholder="Opcional"/>
          </div>
          <button type="button" class="btn btn-sm" @click="removeTender(i)" x-show="tenders.length > 1">×</button>
        </div>
      </template>

      <div class="row-between">
        <button type="button" class="btn btn-sm" @click="addTender()">+ Agregar método (pago mixto)</button>
        <div class="muted">Pagado: <strong x-text="fmt(paidCents())">$0.00</strong></div>
      </div>

      <div class="card" style="background: var(--surface-muted);">
        <div class="row-between" x-show="remainingCents() > 0">
          <span>Falta por pagar</span>
          <strong style="color: var(--danger);" x-text="fmt(remainingCents())">$0.00</strong>
        </div>
        <div class="row-between" x-show="remainingCents() === 0">
          <span>Cambio a entregar</span>
          <strong style="color: var(--success); font-size: 16px;" x-text="fmt(changeCents())">$0.00</strong>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" :disabled="paidCents() < totalCents">
        Confirmar cobro
      </button>
    </form>
  </div>
</div>

<div th:fragment="errorAlert" class="badge badge-danger" th:text="${error}">Error al cobrar</div>
</body>
</html>
